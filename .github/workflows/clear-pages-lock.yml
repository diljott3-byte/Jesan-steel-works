name: Clear stale Pages deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  clear-lock:
    if: contains(github.event.head_commit.message, '[clear-pages-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: 1aa76c3cde94028cf17ac30ee23cc4f806d023ca
        run: |
          response=$(curl --silent --show-error --write-out '%{http_code}' --output /tmp/response.txt \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${DEPLOYMENT_ID}")
          cat /tmp/response.txt || true
          if [ "$response" != "204" ] && [ "$response" != "404" ]; then
            echo "Unexpected HTTP status: $response"
            exit 1
          fi
          echo "Stale Pages deployment cleared (HTTP $response)."
